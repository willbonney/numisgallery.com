    <script type="application/ld+json" id="numisgallery-faq-json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is NumisGallery?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "NumisGallery is a free web app for cataloging, organizing, and showcasing banknote collections. Collectors and dealers use it to store PMG-certified notes, world paper money, and US currency in a shareable digital gallery."
            }
          },
          {
            "@type": "Question",
            "name": "Can I catalog PMG-certified banknotes?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Enter a PMG certification number and grade to fetch high-resolution obverse and reverse images plus certification details, then save the note to your collection."
            }
          },
          {
            "@type": "Question",
            "name": "Does NumisGallery work for world banknotes and US currency?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. World notes can be cataloged with Pick numbers, country, and denomination. US notes support Friedberg numbers, issuing authority, and Federal Reserve district details."
            }
          },
          {
            "@type": "Question",
            "name": "Is NumisGallery free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The free plan includes up to 50 banknotes, PMG image fetching, AI data extraction, and CSV export. Pro unlocks unlimited notes, more monthly fetches, extra storage, and PDF export."
            }
          },
          {
            "@type": "Question",
            "name": "Can I share my banknote collection online?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Mark notes as public and share a gallery link so other collectors can browse your paper money collection without needing an account."
            }
          }
        ]
      }
    </script>
