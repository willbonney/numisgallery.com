services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    # Do not enable --migrationsDir against incomplete export migrations;
    # apply rules via Admin UI / API or vetted migrations only.
    command: serve --http=0.0.0.0:8090 --dir=/pb_data --hooksDir=/pb/pb_hooks
    container_name: pocketbase
    ports:
      - "8090:8090"
    volumes:
      - ./backend/pb_data:/pb_data
      - ./backend/pb_hooks:/pb/pb_hooks
    restart: unless-stopped
